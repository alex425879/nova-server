<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NOVA Admin</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#0b0b0d;
    color:white;
}

header{
    height:70px;
    background:#121216;
    border-bottom:1px solid #292932;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
}

.logo{
    color:#c9a45c;
    font-size:27px;
    font-weight:bold;
}

.logout{
    background:#292932;
    color:white;
    border:0;
    padding:10px 17px;
    border-radius:9px;
    cursor:pointer;
}

.container{
    width:92%;
    max-width:1200px;
    margin:30px auto;
}

.login{
    max-width:400px;
    margin:100px auto;
    background:#151519;
    border:1px solid #292932;
    border-radius:18px;
    padding:30px;
}

.login h1{
    text-align:center;
    margin-bottom:25px;
}

input,select{
    width:100%;
    background:#0d0d10;
    color:white;
    border:1px solid #33333c;
    border-radius:9px;
    padding:13px;
    margin-top:7px;
    margin-bottom:15px;
    outline:none;
}

label{
    color:#aaa;
}

.btn{
    width:100%;
    border:0;
    border-radius:9px;
    padding:13px;
    background:#c9a45c;
    color:#111;
    font-weight:bold;
    cursor:pointer;
}

.message{
    text-align:center;
    margin-top:15px;
    color:#c9a45c;
}

#dashboard{
    display:none;
}

.tabs{
    display:flex;
    gap:10px;
    overflow-x:auto;
    margin-bottom:25px;
}

.tab{
    background:#18181d;
    border:1px solid #292932;
    color:white;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
}

.tab.active{
    background:#c9a45c;
    color:#111;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.card{
    background:#151519;
    border:1px solid #292932;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
}

.card h2{
    margin-bottom:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px;
}

.small-btn{
    border:0;
    padding:9px 13px;
    border-radius:8px;
    cursor:pointer;
    background:#c9a45c;
    color:#111;
    font-weight:bold;
}

.delete{
    background:#7d2525;
    color:white;
}

.confirm{
    background:#286b3c;
    color:white;
}

.cancel{
    background:#7d2525;
    color:white;
}

table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
}

th,td{
    border-bottom:1px solid #292932;
    padding:12px;
    text-align:right;
}

th{
    color:#c9a45c;
}

.item{
    background:#101014;
    border:1px solid #292932;
    border-radius:10px;
    padding:14px;
    margin-bottom:10px;
}

.status{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    background:#292932;
    color:#c9a45c;
}

@media(max-width:700px){
    table{
        font-size:12px;
    }

    th,td{
        padding:8px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        NOVA ADMIN
    </div>

    <button
        class="logout"
        onclick="logout()"
    >
        تسجيل الخروج
    </button>

</header>


<!-- LOGIN -->

<div id="loginScreen">

    <div class="login">

        <h1>🔐 لوحة المالك</h1>

        <label>
            اسم المستخدم
        </label>

        <input
            id="adminUser"
            type="text"
            placeholder="Admin"
        >

        <label>
            كلمة المرور
        </label>

        <input
            id="adminPassword"
            type="password"
            placeholder="Admin"
        >

        <button
            class="btn"
            onclick="adminLogin()"
        >
            دخول لوحة الإدارة
        </button>

        <div
            class="message"
            id="loginMessage"
        ></div>

    </div>

</div>


<!-- DASHBOARD -->

<div
    id="dashboard"
    class="container"
>

    <div class="tabs">

        <button
            class="tab active"
            onclick="showSection('home',this)"
        >
            📊 الرئيسية
        </button>

        <button
            class="tab"
            onclick="showSection('tables',this)"
        >
            🪑 الترابيزات
        </button>

        <button
            class="tab"
            onclick="showSection('hours',this)"
        >
            🕐 مواعيد العمل
        </button>

        <button
            class="tab"
            onclick="showSection('menu',this)"
        >
            🍽️ المنيو
        </button>

        <button
            class="tab"
            onclick="showSection('reservations',this)"
        >
            📋 الحجوزات
        </button>

    </div>


    <!-- HOME -->

    <section
        id="home"
        class="section active"
    >

        <div class="card">

            <h2>
                أهلاً بك في لوحة إدارة NOVA 👋
            </h2>

            <p style="color:#999;line-height:2">
                من هنا تقدر تتحكم في الترابيزات،
                مواعيد العمل، المنيو، والحجوزات.
            </p>

        </div>

    </section>


    <!-- TABLES -->

    <section
        id="tables"
        class="section"
    >

        <div class="card">

            <h2>
                إضافة ترابيزة
            </h2>

            <div class="grid">

                <div>
                    <label>
                        رقم الترابيزة
                    </label>

                    <input
                        id="tableNumber"
                        type="number"
                        placeholder="1"
                    >
                </div>

                <div>
                    <label>
                        عدد المقاعد
                    </label>

                    <input
                        id="tableSeats"
                        type="number"
                        placeholder="4"
                    >
                </div>

            </div>

            <button
                class="btn"
                onclick="addTable()"
            >
                إضافة الترابيزة
            </button>

        </div>


        <div class="card">

            <h2>
                الترابيزات الحالية
            </h2>

            <div id="tablesList">
                جاري التحميل...
            </div>

        </div>

    </section>


    <!-- HOURS -->

    <section
        id="hours"
        class="section"
    >

        <div class="card">

            <h2>
                🕐 مواعيد العمل
            </h2>

            <div id="hoursList">
                جاري التحميل...
            </div>

        </div>

    </section>


    <!-- MENU -->

    <section
        id="menu"
        class="section"
    >

        <div class="card">

            <h2>
                إضافة قسم
            </h2>

            <input
                id="categoryName"
                placeholder="مثال: المشروبات"
            >

            <button
                class="btn"
                onclick="addCategory()"
            >
                إضافة القسم
            </button>

        </div>


        <div class="card">

            <h2>
                إضافة منتج
            </h2>

            <label>
                القسم
            </label>

            <select id="categorySelect">
                <option value="">
                    اختر القسم
                </option>
            </select>

            <label>
                اسم المنتج
            </label>

            <input
                id="itemName"
                placeholder="مثال: بيتزا"
            >

            <label>
                الوصف
            </label>

            <input
                id="itemDescription"
                placeholder="وصف المنتج"
            >

            <label>
                السعر
            </label>

            <input
                id="itemPrice"
                type="number"
                step="0.01"
                placeholder="150"
            >

            <label>
                رابط الصورة
            </label>

            <input
                id="itemImage"
                placeholder="https://..."
            >

            <button
                class="btn"
                onclick="addMenuItem()"
            >
                إضافة المنتج
            </button>

        </div>


        <div class="card">

            <h2>
                المنتجات الحالية
            </h2>

            <div id="menuList">
                جاري التحميل...
            </div>

        </div>

    </section>


    <!-- RESERVATIONS -->

    <section
        id="reservations"
        class="section"
    >

        <div class="card">

            <h2>
                📋 الحجوزات
            </h2>

            <div id="reservationsList">
                جاري التحميل...
            </div>

        </div>

    </section>

</div>


<script>


// ==============================
// ADMIN LOGIN
// ==============================

function adminLogin(){

    const username =
        document.getElementById("adminUser").value;

    const password =
        document.getElementById("adminPassword").value;

    if(
        username === "Admin" &&
        password === "Admin"
    ){

        localStorage.setItem(
            "novaAdmin",
            "true"
        );

        showDashboard();

    }else{

        document.getElementById(
            "loginMessage"
        ).innerText =
            "اسم المستخدم أو كلمة المرور غير صحيحة";

    }

}


function showDashboard(){

    document.getElementById(
        "loginScreen"
    ).style.display = "none";

    document.getElementById(
        "dashboard"
    ).style.display = "block";

    loadTables();

    loadHours();

    loadMenu();

    loadReservations();

}


function logout(){

    localStorage.removeItem(
        "novaAdmin"
    );

    location.reload();

}


// ==============================
// TABS
// ==============================

function showSection(id,button){

    document
        .querySelectorAll(".section")
        .forEach(function(section){

            section.classList.remove("active");

        });

    document
        .querySelectorAll(".tab")
        .forEach(function(tab){

            tab.classList.remove("active");

        });

    document
        .getElementById(id)
        .classList.add("active");

    button.classList.add("active");

}


// ==============================
// TABLES
// ==============================

async function loadTables(){

    const response =
        await fetch("/api/tables");

    const data =
        await response.json();

    const box =
        document.getElementById("tablesList");

    if(!data.tables.length){

        box.innerHTML =
            "<p style='color:#888'>لا توجد ترابيزات</p>";

        return;

    }

    box.innerHTML =
        data.tables.map(function(table){

            return `

                <div class="item">

                    🪑 <b>
                        ترابيزة ${table.table_number}
                    </b>

                    <br>

                    👥 السعة:
                    ${table.seats} أفراد

                    <br><br>

                    <button
                        class="small-btn delete"
                        onclick="deleteTable(${table.id})"
                    >
                        حذف
                    </button>

                </div>

            `;

        }).join("");

}


async function addTable(){

    const table_number =
        document.getElementById(
            "tableNumber"
        ).value;

    const seats =
        document.getElementById(
            "tableSeats"
        ).value;

    if(!table_number || !seats){

        alert("اكتب رقم الترابيزة وعدد المقاعد");

        return;

    }

    const response =
        await fetch(
            "/api/admin/tables",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    table_number,
                    seats
                })
            }
        );

    const data =
        await response.json();

    alert(data.message || "تمت الإضافة");

    if(data.success){

        document.getElementById(
            "tableNumber"
        ).value = "";

        document.getElementById(
            "tableSeats"
        ).value = "";

        loadTables();

    }

}


async function deleteTable(id){

    if(!confirm("هل تريد حذف الترابيزة؟"))
        return;

    await fetch(
        `/api/admin/tables/${id}`,
        {
            method:"DELETE"
        }
    );

    loadTables();

}


// ==============================
// HOURS
// ==============================

async function loadHours(){

    const response =
        await fetch("/api/working-hours");

    const data =
        await response.json();

    const box =
        document.getElementById("hoursList");

    box.innerHTML =
        data.hours.map(function(day){

            return `

                <div class="item">

                    <b>
                        ${day.day}
                    </b>

                    <br><br>

                    <label>
                        من
                    </label>

                    <input
                        type="time"
                        id="open-${day.id}"
                        value="${day.open_time || ""}"
                    >

                    <label>
                        إلى
                    </label>

                    <input
                        type="time"
                        id="close-${day.id}"
                        value="${day.close_time || ""}"
                    >

                    <label>
                        <input
                            type="checkbox"
                            id="closed-${day.id}"
                            ${day.closed ? "checked" : ""}
                        >
                        مغلق
                    </label>

                    <button
                        class="small-btn"
                        onclick="saveHours(${day.id})"
                    >
                        حفظ
                    </button>

                </div>

            `;

        }).join("");

}


async function saveHours(id){

    const open_time =
        document.getElementById(
            `open-${id}`
        ).value;

    const close_time =
        document.getElementById(
            `close-${id}`
        ).value;

    const closed =
        document.getElementById(
            `closed-${id}`
        ).checked;

    await fetch(
        `/api/admin/working-hours/${id}`,
        {
            method:"PUT",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                open_time,
                close_time,
                closed
            })
        }
    );

    alert("تم حفظ مواعيد العمل");

}


// ==============================
// MENU
// ==============================

let categories = [];

async function loadMenu(){

    const response =
        await fetch("/api/menu");

    const data =
        await response.json();

    categories =
        data.categories || [];

    const select =
        document.getElementById(
            "categorySelect"
        );

    select.innerHTML =
        `<option value="">
            اختر القسم
        </option>`;

    categories.forEach(function(category){

        const option =
            document.createElement("option");

        option.value =
            category.id;

        option.innerText =
            category.name;

        select.appendChild(option);

    });


    const list =
        document.getElementById(
            "menuList"
        );

    if(!data.items.length){

        list.innerHTML =
            "<p style='color:#888'>لا توجد منتجات</p>";

        return;

    }

    list.innerHTML =
        data.items.map(function(item){

            return `

                <div class="item">

                    <b>
                        ${item.name}
                    </b>

                    <br>

                    القسم:
                    ${item.category_name || "بدون قسم"}

                    <br>

                    السعر:
                    <span style="color:#c9a45c">
                        ${item.price} جنيه
                    </span>

                    <br>

                    ${item.description || ""}

                    <br><br>

                    <button
                        class="small-btn delete"
                        onclick="deleteMenu(${item.id})"
                    >
                        حذف
                    </button>

                </div>

            `;

        }).join("");

}


async function addCategory(){

    const name =
        document.getElementById(
            "categoryName"
        ).value.trim();

    if(!name){

        alert("اكتب اسم القسم");

        return;

    }

    const response =
        await fetch(
            "/api/admin/categories",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    name
                })
            }
        );

    const data =
        await response.json();

    if(data.success){

        document.getElementById(
            "categoryName"
        ).value = "";

        alert("تم إضافة القسم");

        loadMenu();

    }else{

        alert(data.message);

    }

}


async function addMenuItem(){

    const category_id =
        document.getElementById(
            "categorySelect"
        ).value;

    const name =
        document.getElementById(
            "itemName"
        ).value.trim();

    const description =
        document.getElementById(
            "itemDescription"
        ).value.trim();

    const price =
        document.getElementById(
            "itemPrice"
        ).value;

    const image =
        document.getElementById(
            "itemImage"
        ).value.trim();

    if(!name || !price){

        alert("اسم المنتج والسعر مطلوبان");

        return;

    }

    const response =
        await fetch(
            "/api/admin/menu",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({

                    category_id,

                    name,

                    description,

                    price,

                    image

                })
            }
        );

    const data =
        await response.json();

    if(data.success){

        alert("تم إضافة المنتج");

        document.getElementById(
            "itemName"
        ).value = "";

        document.getElementById(
            "itemDescription"
        ).value = "";

        document.getElementById(
            "itemPrice"
        ).value = "";

        document.getElementById(
            "itemImage"
        ).value = "";

        loadMenu();

    }else{

        alert(data.message);

    }

}


async function deleteMenu(id){

    if(!confirm("هل تريد حذف المنتج؟"))
        return;

    await fetch(
        `/api/admin/menu/${id}`,
        {
            method:"DELETE"
        }
    );

    loadMenu();

}


// ==============================
// RESERVATIONS
// ==============================

async function loadReservations(){

    const response =
        await fetch(
            "/api/admin/reservations"
        );

    const data =
        await response.json();

    const box =
        document.getElementById(
            "reservationsList"
        );

    if(!data.reservations.length){

        box.innerHTML =
            "<p style='color:#888'>لا توجد حجوزات</p>";

        return;

    }

    box.innerHTML =
        data.reservations

.map(function(r){

                return `

                    <div class="item">

                        👤 <b>
                            ${r.user_name}
                        </b>

                        <br>

                        📧 ${r.email}

                        <br>

                        🪑 ترابيزة:
                        ${r.table_number}

                        <br>

                        📅 ${r.date}

                        <br>

                        ⏰ ${r.time}

                        <br>

                        👥 ${r.guests} أشخاص

                        <br>

                        الحالة:
                        <span class="status">
                            ${getStatus(r.status)}
                        </span>

                        <br><br>

                        ${
                            r.status === "pending"
                            ?
                            `
                            <button
                                class="small-btn confirm"
                                onclick="updateReservation(${r.id},'confirmed')"
                            >
                                ✅ تأكيد
                            </button>

                            <button
                                class="small-btn cancel"
                                onclick="updateReservation(${r.id},'cancelled')"
                            >
                                ❌ إلغاء
                            </button>
                            `
                            :
                            ""
                        }

                    </div>

                `;

            })
            .join("");

}


function getStatus(status){

    if(status === "pending")
        return "في انتظار التأكيد";

    if(status === "confirmed")
        return "تم التأكيد";

    if(status === "cancelled")
        return "ملغي";

    if(status === "completed")
        return "مكتمل";

    return status;

}


async function updateReservation(id,status){

    const response =
        await fetch(
            `/api/admin/reservations/${id}`,
            {
                method:"PUT",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    status:status
                })
            }
        );

    const data =
        await response.json();

    alert(
        data.message ||
        "تم تحديث حالة الحجز"
    );

    loadReservations();

}


// ==============================
// START
// ==============================

if(
    localStorage.getItem("novaAdmin") === "true"
){

    showDashboard();

}

</script>

</body>
</html>
